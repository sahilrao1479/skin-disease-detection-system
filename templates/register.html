<!-- REGISTER.HTML -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        linear-gradient(rgba(11, 60, 93, 0.75), rgba(11, 60, 93, 0.75)),
        url("https://images.unsplash.com/photo-1580281657527-47d9c45b0b7b");
    background-size: cover;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 400px;
    padding: 30px;
    border-radius: 18px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(14px);
    box-shadow: 0 20px 45px rgba(0,0,0,0.35);
    color: white;
    text-align: center;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border-radius: 8px;
    border: none;
    background: #0dcaf0;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    background: #0bb5d6;
}

.link {
    margin-top: 15px;
    display: block;
    color: #ddd;
}

.error {
    color: #ff6b6b;
    margin-top: 10px;
}

.password-box{
    position: relative;
    width: 100%;
}

.password-box input{
    width: 100%;
    padding-right: 45px;
}

.toggle{
    position: absolute;
    right: 15px;
    top: 58%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #333;
    user-select: none;
}
</style>
</head>

<body>

<div class="container">
    <h2>Doctor Registration</h2>

    <form method="POST" action="/register">

        <input name="username" placeholder="Email or Doctor ID (DOC123)" required>

        <div class="password-box">
            <input type="password" id="password" name="password" placeholder="Password" required>
            <span class="toggle" onclick="togglePassword()">👁</span>
        </div>

        <div class="password-box">
            <input type="password" id="confirm" name="confirm" placeholder="Confirm Password" required>
            <span class="toggle" onclick="toggleConfirm()">👁</span>
        </div>

        <button type="submit">Register</button>
    </form>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="error">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <a class="link" href="/">Back to Login</a>
</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");

    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}

function toggleConfirm() {
    const confirm = document.getElementById("confirm");

    if (confirm.type === "password") {
        confirm.type = "text";
    } else {
        confirm.type = "password";
    }
}
</script>

</body>
</html>
